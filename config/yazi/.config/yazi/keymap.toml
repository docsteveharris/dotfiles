# keymap.toml
#[[mgr.prepend_keymap]]
#on   = "T"
#run  = "plugin toggle-pane min-preview"
#desc = "Show or hide the preview pane"

# Toggle pane
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

# System preview
[[mgr.prepend_keymap]]
on = "<C-p>"
run = 'shell -- qlmanage -p "$@"'

# DuckDb
[[manager.prepend_keymap]]
on = "H"
run = "plugin duckdb -1"
desc = "Scroll one column to the left"

[[manager.prepend_keymap]]
on = "L"
run = "plugin duckdb +1"
desc = "Scroll one column to the right"

[[manager.prepend_keymap]]
on = ["g", "o"]
run = "plugin duckdb -open"
desc = "open with duckdb"

[[manager.prepend_keymap]]
on = ["g", "u"]
run = "plugin duckdb -ui"
desc = "open with duckdb ui"

# Jumplist
# https://github.com/0xHouss/jumplist.yazi#usage
# Inspired from vim's jumplist bindings
[[manager.prepend_keymap]]
on = [ "<C-o>"]
run = "plugin jumplist -- --direction=back"
desc = "Go back in jumplist"

[[manager.prepend_keymap]]
on = [ "<C-i>"]
run = "plugin jumplist -- --direction=forward"
desc = "Go forward in jumplist"


